# ==============================================================================
# AutoPrompt Nginx Main Configuration (Phase 8.3)
# Tuned for high-concurrency reverse proxying, HTTP/2, and security hardening
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Suppress Nginx version information from HTTP response headers
    server_tokens off;

    # Logging Configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # TCP Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Request Body Size Limitation (Protects against memory exhaustion attacks)
    client_max_body_size 1m;
    client_body_buffer_size 128k;

    # Gzip Compression Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Rate Limiting Zones ───────────────────────────────────────────────────
    # 1. AI Endpoints Limit: 15 req/min per IP (aligned with Google Gemini Free Tier)
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=15r/m;

    # 2. General REST API Limit: 60 req/min per IP (for token counting & saved prompts)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;

    # Return standard HTTP 429 Too Many Requests when rate limits are exceeded
    limit_req_status 429;

    # Include modular virtual host configurations
    include /etc/nginx/conf.d/*.conf;
}
