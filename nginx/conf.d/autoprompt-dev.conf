# ==============================================================================
# AutoPrompt Development / Local HTTP Reverse Proxy Configuration
# Used for local container validation on port 80 without SSL/TLS certificates
# ==============================================================================

upstream backend_upstream_dev {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    # Static Web Frontend
    root /var/www/html;
    index index.html;

    # Static Asset Caching
    location ~* \.(css|js|svg|png|jpg|jpeg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate Limiting on AI Endpoints
    location ~ ^/api/(generate|optimize)$ {
        limit_req zone=ai_limit burst=5 nodelay;

        proxy_pass http://backend_upstream_dev;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # General REST Endpoints & Health Check
    location ~ ^/(api|health) {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://backend_upstream_dev;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
