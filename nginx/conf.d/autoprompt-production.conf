# ==============================================================================
# AutoPrompt Production HTTPS Server Block (Phase 8.3)
# Reverse proxy, Let's Encrypt TLS 1.3, rate limiting, and static file delivery
# ==============================================================================

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

# ── HTTP Port 80: ACME Challenge & Automatic HTTPS Redirection ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt / Certbot Webroot Validation Path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic permanently to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Port 443: Hardened Production Server ────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ── SSL/TLS Certificates (Managed by Certbot) ─────────────────────────────
    ssl_certificate /etc/letsencrypt/live/autoprompt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoprompt/privkey.pem;

    # ── Modern TLS Ciphers & Protocol Settings ────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ── OCSP Stapling (Validates certificate revocation with zero client latency)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Enterprise Security Headers ───────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self';" always;

    # ── Static Web Frontend (Vanilla JS SPA) ──────────────────────────────────
    root /var/www/html;
    index index.html;

    # Browser Caching for Immutable Static Assets
    location ~* \.(css|js|svg|png|jpg|jpeg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Fallback (Never cache index.html to ensure immediate deployment visibility)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Block Development Diagnostics Endpoint in Production ─────────────────
    location = /api/test-gemini {
        return 404;
    }

    # ── AI Endpoints: Strict Rate Limiting (15 req/min per IP) ─────────────────
    location ~ ^/api/(generate|optimize)$ {
        limit_req zone=ai_limit burst=5 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Keepalive upstream connection
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for AI thinking models
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── General REST Endpoints & Health Check (60 req/min per IP) ─────────────
    location ~ ^/(api|health) {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
